name: Generate Contribution Snake

on:
  # Schedule automatic execution every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  
  # Run on every push to main or master branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Patilavinash4433
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-ocean.svg?color_snake=orange&color_dots=#0a0f1d,#00f2fe,#3b82f6,#8b5cf6,#a855f7

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
