<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-dark-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    .term-prompt { font-family: 'Consolas', 'Fira Code', monospace; font-size: 16px; fill: #10b981; font-weight: bold; }
    .main-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.5px; fill: #0f172a; }
    .role-badge { font-family: 'Consolas', monospace; font-size: 17px; fill: #00f2fe; font-weight: 700; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-style: italic; fill: #0284c7; font-weight: 500; }
    .section-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #a855f7; letter-spacing: 1px; }
    .pill-label { font-family: 'Consolas', monospace; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
    .about-item { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; fill: #334155; font-weight: 500; }
    .stat-val { font-family: 'Consolas', monospace; font-size: 20px; font-weight: 800; fill: #00f2fe; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; font-weight: 600; }

    .cursor { animation: cursor-blink 0.9s infinite; fill: #10b981; }
  </style>

  <!-- Background Frame -->
  <rect width="720" height="540" rx="16" fill="url(#bg-dark-banner)"/>
  <rect width="718" height="538" x="1" y="1" rx="15" fill="none" stroke="url(#border-gradient)" stroke-width="2"/>

  <!-- Content Container -->
  <g transform="translate(32, 42)">
    <!-- Terminal Prompt -->
    <text x="0" y="0" class="term-prompt">avinash@ai-ml-engineer:~$ cat README.md<tspan class="cursor"> _</tspan></text>

    <!-- Main Title -->
    <text x="0" y="48" class="main-name" filter="url(#text-glow)">
      Patil Avinash Chandrabhan ⚡
    </text>

    <!-- Role Badge Box -->
    <g transform="translate(0, 72)">
      <rect width="490" height="34" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.2"/>
      <text x="16" y="23" class="role-badge">&lt; AI/ML Engineer &amp; Data Analyst @ Indo Era /&gt;</text>
    </g>

    <!-- Tagline Box -->
    <g transform="translate(0, 122)">
      <rect width="560" height="38" rx="8" fill="#0284c7" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="24" class="tagline-text">⚡ "Turning Enterprise Data into Business Intelligence &amp; AI Automation."</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" class="section-head">⚡ TECH STACK &amp; TOOLS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="76" height="26" rx="13" fill="#f1f5f9" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="38" y="17.5" text-anchor="middle" class="pill-label" fill="#38bdf8">Python</text>

        <rect x="84" y="0" width="56" height="26" rx="13" fill="#f1f5f9" stroke="#00f2fe" stroke-width="1.2"/>
        <text x="112" y="17.5" text-anchor="middle" class="pill-label" fill="#00f2fe">SQL</text>

        <rect x="148" y="0" width="90" height="26" rx="13" fill="#f1f5f9" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="193" y="17.5" text-anchor="middle" class="pill-label" fill="#f59e0b">Power BI</text>

        <rect x="246" y="0" width="66" height="26" rx="13" fill="#f1f5f9" stroke="#10b981" stroke-width="1.2"/>
        <text x="279" y="17.5" text-anchor="middle" class="pill-label" fill="#10b981">Excel</text>

        <rect x="320" y="0" width="150" height="26" rx="13" fill="#f1f5f9" stroke="#a855f7" stroke-width="1.2"/>
        <text x="395" y="17.5" text-anchor="middle" class="pill-label" fill="#a855f7">Machine Learning</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="76" height="26" rx="13" fill="#f1f5f9" stroke="#ec4899" stroke-width="1.2"/>
        <text x="38" y="17.5" text-anchor="middle" class="pill-label" fill="#ec4899">FastAPI</text>

        <rect x="84" y="0" width="70" height="26" rx="13" fill="#f1f5f9" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="119" y="17.5" text-anchor="middle" class="pill-label" fill="#3b82f6">MySQL</text>

        <rect x="162" y="0" width="112" height="26" rx="13" fill="#f1f5f9" stroke="#00f2fe" stroke-width="1.2"/>
        <text x="218" y="17.5" text-anchor="middle" class="pill-label" fill="#00f2fe">Scikit-Learn</text>

        <rect x="282" y="0" width="76" height="26" rx="13" fill="#f1f5f9" stroke="#10b981" stroke-width="1.2"/>
        <text x="320" y="17.5" text-anchor="middle" class="pill-label" fill="#10b981">Pandas</text>

        <rect x="366" y="0" width="70" height="26" rx="13" fill="#f1f5f9" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="401" y="17.5" text-anchor="middle" class="pill-label" fill="#f59e0b">NumPy</text>
      </g>
    </g>

    <!-- About Me Lines -->
    <g transform="translate(0, 285)">
      <text x="0" y="0" class="section-head" fill="#ec4899">💗 ABOUT ME</text>
      <text x="0" y="24" class="about-item">🔹 Data Analyst &amp; AI/ML Engineer working professionally at <tspan fill="#0f172a" font-weight="bold">Indo Era</tspan>.</text>
      <text x="0" y="48" class="about-item">🔹 Building interactive Power BI dashboards, automated Python &amp; SQL ETL pipelines.</text>
      <text x="0" y="72" class="about-item">🔹 Expanding capabilities in Machine Learning, Data Science &amp; Predictive Models.</text>
    </g>

    <!-- Stats Bar -->
    <g transform="translate(0, 385)">
      <rect width="500" height="56" rx="10" fill="#0284c7" stroke="#334155" stroke-width="1.2"/>
      
      <g transform="translate(25, 15)">
        <text x="0" y="14" class="stat-val">25+</text>
        <text x="0" y="28" class="stat-lbl">Public Repos</text>
      </g>
      <g transform="translate(150, 15)">
        <text x="0" y="14" class="stat-val" fill="#38bdf8">500+</text>
        <text x="0" y="28" class="stat-lbl">Commits</text>
      </g>
      <g transform="translate(275, 15)">
        <text x="0" y="14" class="stat-val" fill="#f59e0b">10+</text>
        <text x="0" y="28" class="stat-lbl">Stars</text>
      </g>
      <g transform="translate(385, 15)">
        <text x="0" y="14" class="stat-val" fill="#a855f7">10+</text>
        <text x="0" y="28" class="stat-lbl">Followers</text>
      </g>
    </g>
  </g>
</svg>