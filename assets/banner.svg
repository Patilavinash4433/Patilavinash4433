<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="auto">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
      <circle cx="30" cy="30" r="1" fill="#00f2fe" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { r: 3px; opacity: 0.4; }
      50% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes bar-grow-1 {
      0%, 100% { height: 18px; y: 192px; }
      50% { height: 48px; y: 162px; }
    }
    @keyframes bar-grow-2 {
      0%, 100% { height: 38px; y: 172px; }
      50% { height: 22px; y: 188px; }
    }
    @keyframes bar-grow-3 {
      0%, 100% { height: 26px; y: 184px; }
      50% { height: 58px; y: 152px; }
    }
    
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.6px;
    }
    .tagline {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-style: italic;
      font-size: 14px;
      fill: #38bdf8;
    }
    .badge-text {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 11.5px;
      fill: #e2e8f0;
    }
    
    .node-1 { animation: pulse-node 3s infinite ease-in-out; }
    .node-2 { animation: pulse-node 4s infinite ease-in-out 1s; }
    .node-3 { animation: pulse-node 2.5s infinite ease-in-out 0.5s; }
    .flow-line { stroke-dasharray: 8 6; animation: dash-flow 20s linear infinite; }
    .p-1 { animation: float-particle 6s infinite ease-in-out; }
    .p-2 { animation: float-particle 8s infinite ease-in-out 2s; }
    .p-3 { animation: float-particle 5s infinite ease-in-out 1s; }
    .b-1 { animation: bar-grow-1 4s infinite ease-in-out; }
    .b-2 { animation: bar-grow-2 3.5s infinite ease-in-out 0.7s; }
    .b-3 { animation: bar-grow-3 5s infinite ease-in-out 1.2s; }
  </style>

  <!-- Card Background -->
  <rect width="950" height="260" rx="16" fill="url(#bg-grad)"/>
  <rect width="950" height="260" rx="16" fill="url(#cyber-grid)"/>
  <rect width="948" height="258" x="1" y="1" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- Neural Network Mesh (Left & Background) -->
  <g opacity="0.35">
    <line x1="60" y1="50" x2="160" y2="90" stroke="#00f2fe" stroke-width="1" class="flow-line"/>
    <line x1="160" y1="90" x2="100" y2="180" stroke="#8b5cf6" stroke-width="1" class="flow-line"/>
    <line x1="100" y1="180" x2="220" y2="210" stroke="#3b82f6" stroke-width="1" class="flow-line"/>
    <line x1="160" y1="90" x2="220" y2="210" stroke="#06b6d4" stroke-width="1"/>
    <line x1="60" y1="50" x2="100" y2="180" stroke="#00f2fe" stroke-width="0.8"/>
    
    <circle cx="60" cy="50" r="4" fill="#00f2fe" class="node-1"/>
    <circle cx="160" cy="90" r="5" fill="#3b82f6" class="node-2"/>
    <circle cx="100" cy="180" r="4" fill="#8b5cf6" class="node-3"/>
    <circle cx="220" cy="210" r="4" fill="#06b6d4" class="node-1"/>
  </g>

  <!-- Floating Particles -->
  <circle cx="120" cy="40" r="2" fill="#00f2fe" class="p-1"/>
  <circle cx="280" cy="70" r="1.5" fill="#a855f7" class="p-2"/>
  <circle cx="70" cy="130" r="2" fill="#38bdf8" class="p-3"/>
  <circle cx="850" cy="50" r="2" fill="#00f2fe" class="p-2"/>
  <circle cx="900" cy="180" r="1.5" fill="#8b5cf6" class="p-1"/>

  <!-- Right Side Animated Data Telemetry / Graph Visual -->
  <g transform="translate(730, 40)" opacity="0.88">
    <rect width="180" height="180" rx="10" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
    <rect width="180" height="24" rx="10" fill="#0f172a"/>
    <circle cx="15" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="27" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="39" cy="12" r="3.5" fill="#10b981"/>
    <text x="55" y="16" font-family="monospace" font-size="10" fill="#64748b">AI_METRICS.LOG</text>

    <!-- Telemetry Graph Bars -->
    <rect x="25" y="175" width="14" height="35" rx="3" fill="url(#accent-cyan)" class="b-1"/>
    <rect x="48" y="165" width="14" height="45" rx="3" fill="#3b82f6" class="b-2"/>
    <rect x="71" y="180" width="14" height="30" rx="3" fill="#8b5cf6" class="b-3"/>
    <rect x="94" y="155" width="14" height="55" rx="3" fill="url(#accent-cyan)" class="b-2"/>
    <rect x="117" y="170" width="14" height="40" rx="3" fill="#a855f7" class="b-1"/>
    <rect x="140" y="160" width="14" height="50" rx="3" fill="#3b82f6" class="b-3"/>

    <!-- Waveform overlay line -->
    <path d="M 25 150 Q 50 110, 75 130 T 125 100 T 155 115" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cyan)"/>
    <circle cx="155" cy="115" r="3" fill="#00f2fe" filter="url(#glow-cyan)"/>
    
    <text x="18" y="48" font-family="monospace" font-size="10" fill="#10b981">● MODEL: ACTIVE</text>
    <text x="18" y="64" font-family="monospace" font-size="10" fill="#38bdf8">● ACCURACY: 98.4%</text>
    <text x="18" y="80" font-family="monospace" font-size="10" fill="#a855f7">● DATA_PIPELINE: OK</text>
  </g>

  <!-- Main Hero Text Content (Left-Centered) -->
  <g transform="translate(50, 48)">
    <!-- Main Title -->
    <text x="0" y="34" fill="url(#text-grad)" class="title" filter="url(#glow-cyan)">
      PATIL AVINASH CHANDRABHAN
    </text>

    <!-- Role & Company -->
    <g transform="translate(0, 62)">
      <rect x="0" y="-18" width="410" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="1" class="subtitle">
        AI/ML Engineer &amp; Data Analyst <tspan fill="#38bdf8">@ Indo Era</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="106" class="tagline">
      ⚡ "Turning Data into Intelligence &amp; Business Automation."
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 128)">
      <!-- Badge 1: Python -->
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" class="badge-text" fill="#38bdf8">Python</text>

      <!-- Badge 2: SQL -->
      <rect x="78" y="0" width="52" height="24" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <text x="104" y="16" text-anchor="middle" class="badge-text" fill="#00f2fe">SQL</text>

      <!-- Badge 3: Power BI -->
      <rect x="138" y="0" width="82" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="179" y="16" text-anchor="middle" class="badge-text" fill="#f59e0b">Power BI</text>

      <!-- Badge 4: Excel -->
      <rect x="228" y="0" width="60" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="258" y="16" text-anchor="middle" class="badge-text" fill="#10b981">Excel</text>

      <!-- Badge 5: Machine Learning -->
      <rect x="296" y="0" width="138" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="365" y="16" text-anchor="middle" class="badge-text" fill="#a855f7">Machine Learning</text>

      <!-- Badge 6: AI -->
      <rect x="442" y="0" width="42" height="24" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="463" y="16" text-anchor="middle" class="badge-text" fill="#ec4899">AI</text>
    </g>
  </g>
</svg>
