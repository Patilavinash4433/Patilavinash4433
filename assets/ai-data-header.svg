<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 40" width="100%" height="auto">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="80%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
