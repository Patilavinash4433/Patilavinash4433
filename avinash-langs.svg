<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 220" width="100%" height="auto">
  <defs>
    <linearGradient id="langs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="langs-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <style>
    .lang-title { font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: bold; fill: #00f2fe; }
    .lang-name { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .lang-pct { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #94a3b8; }
  </style>

  <rect width="350" height="220" rx="12" fill="url(#langs-bg)"/>
  <rect width="348" height="218" x="1" y="1" rx="11" fill="none" stroke="url(#langs-border)" stroke-width="1.5"/>

  <text x="25" y="32" class="lang-title">⚡ MOST USED TECHNOLOGIES</text>
  <line x1="25" y1="42" x2="325" y2="42" stroke="#334155" stroke-width="1"/>

  <g transform="translate(25, 60)">
    <!-- Python -->
    <text x="0" y="12" class="lang-name">Python (Pandas, ML, FastAPI)</text>
    <text x="260" y="12" class="lang-pct">42%</text>
    <rect x="0" y="20" width="280" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="20" width="118" height="8" rx="4" fill="#3b82f6"/>

    <!-- SQL -->
    <text x="0" y="47" class="lang-name">SQL (MySQL &amp; PostgreSQL)</text>
    <text x="260" y="47" class="lang-pct">26%</text>
    <rect x="0" y="55" width="280" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="55" width="73" height="8" rx="4" fill="#00f2fe"/>

    <!-- Power BI & Excel -->
    <text x="0" y="82" class="lang-name">Power BI &amp; Advanced Excel</text>
    <text x="260" y="82" class="lang-pct">20%</text>
    <rect x="0" y="90" width="280" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="90" width="56" height="8" rx="4" fill="#f59e0b"/>

    <!-- Web Dev / HTML / JS -->
    <text x="0" y="117" class="lang-name">TypeScript / HTML / CSS</text>
    <text x="260" y="117" class="lang-pct">12%</text>
    <rect x="0" y="125" width="280" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="125" width="33" height="8" rx="4" fill="#a855f7"/>
  </g>
</svg>
