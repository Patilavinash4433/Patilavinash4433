<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" width="100%" height="auto">
  <defs>
    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Card Border Metallic Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Lanyard Ribbon Gradient -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Metallic Clip Gradient -->
    <linearGradient id="metal-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes sway {
      0% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
      100% { transform: rotate(-2deg); }
    }
    @keyframes pulse-chip {
      0%, 100% { filter: drop-shadow(0 0 2px #00f2fe); }
      50% { filter: drop-shadow(0 0 8px #00f2fe); }
    }
    .swaying-card {
      transform-origin: 170px 10px;
      animation: sway 6s infinite ease-in-out;
    }
    .badge-name {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 15px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .badge-role {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #38bdf8;
    }
    .badge-company {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #a855f7;
    }
    .badge-id {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 10px;
      fill: #64748b;
    }
    .chip { animation: pulse-chip 3s infinite ease-in-out; }
  </style>

  <!-- Lanyard Top Anchor Point -->
  <circle cx="170" cy="10" r="4" fill="#38bdf8" filter="url(#badge-glow)"/>

  <!-- Swaying Lanyard Group -->
  <g class="swaying-card">
    <!-- Ribbon Left & Right -->
    <path d="M 170 10 L 140 70" stroke="url(#ribbon-grad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 170 10 L 200 70" stroke="url(#ribbon-grad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Ribbon Text Overlay -->
    <text x="145" y="45" font-family="monospace" font-size="7" fill="#ffffff" opacity="0.6" transform="rotate(-62 145 45)">INDO ERA</text>
    <text x="185" y="40" font-family="monospace" font-size="7" fill="#ffffff" opacity="0.6" transform="rotate(62 185 40)">AI/ML</text>

    <!-- Metal Clip Connector -->
    <rect x="155" y="65" width="30" height="18" rx="4" fill="url(#metal-clip)"/>
    <rect x="162" y="77" width="16" height="12" rx="3" fill="#334155"/>
    <circle cx="170" cy="74" r="4" fill="#0f172a"/>

    <!-- ID Card Body -->
    <g transform="translate(45, 85)">
      <!-- Main Card Rectangle -->
      <rect width="250" height="370" rx="16" fill="url(#card-bg)"/>
      <rect width="248" height="368" x="1" y="1" rx="15" fill="none" stroke="url(#card-border)" stroke-width="1.8"/>

      <!-- Card Top Slot Hole -->
      <rect x="105" y="10" width="40" height="8" rx="4" fill="#070a12" stroke="#334155" stroke-width="1"/>

      <!-- Top Header Accent -->
      <path d="M 0 35 L 250 35 L 250 45 Q 125 60 0 45 Z" fill="#1e293b" opacity="0.8"/>
      <text x="125" y="30" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#00f2fe" letter-spacing="2">PASSPORT // ID BADGE</text>

      <!-- Profile Avatar Container -->
      <g transform="translate(75, 55)">
        <circle cx="50" cy="50" r="44" fill="#090d16" stroke="url(#card-border)" stroke-width="2"/>
        <clipPath id="avatar-clip">
          <circle cx="50" cy="50" r="42"/>
        </clipPath>
        <!-- AI/ML Developer Avatar Icon Vector -->
        <g clip-path="url(#avatar-clip)">
          <rect width="100" height="100" fill="#0f172a"/>
          <!-- Head/Shoulders -->
          <circle cx="50" cy="40" r="20" fill="#3b82f6"/>
          <path d="M 20 85 C 20 62, 80 62, 80 85 Z" fill="#00f2fe"/>
          <!-- Futuristic Glasses -->
          <rect x="36" y="34" width="28" height="8" rx="3" fill="#00f2fe" filter="url(#badge-glow)"/>
        </g>
        <!-- Status dot -->
        <circle cx="82" cy="82" r="6" fill="#10b981" stroke="#0f172a" stroke-width="2"/>
      </g>

      <!-- Smart Chip Visual -->
      <g transform="translate(20, 140)" class="chip">
        <rect width="32" height="24" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
        <line x1="20" y1="140" x2="20" y2="164" stroke="#78350f" stroke-width="0.8"/>
        <line x1="36" y1="140" x2="36" y2="164" stroke="#78350f" stroke-width="0.8"/>
        <line x1="20" y1="152" x2="52" y2="152" stroke="#78350f" stroke-width="0.8"/>
      </g>

      <!-- Information Section -->
      <g transform="translate(125, 175)" text-anchor="middle">
        <text x="0" y="0" class="badge-name">PATIL AVINASH C.</text>
        <text x="0" y="20" class="badge-role">AI/ML ENGINEER</text>
        <text x="0" y="36" class="badge-company">&amp; DATA ANALYST @ INDO ERA</text>
      </g>

      <!-- Horizontal Divider -->
      <line x1="25" y1="230" x2="225" y2="230" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>

      <!-- QR Code & Barcode Visual -->
      <g transform="translate(25, 245)">
        <!-- Micro QR Code Representation -->
        <rect width="50" height="50" rx="4" fill="#ffffff"/>
        <rect x="5" y="5" width="16" height="16" fill="#000000"/>
        <rect x="8" y="8" width="10" height="10" fill="#ffffff"/>
        <rect x="10" y="10" width="6" height="6" fill="#000000"/>
        
        <rect x="29" y="5" width="16" height="16" fill="#000000"/>
        <rect x="32" y="8" width="10" height="10" fill="#ffffff"/>
        <rect x="34" y="10" width="6" height="6" fill="#000000"/>

        <rect x="5" y="29" width="16" height="16" fill="#000000"/>
        <rect x="8" y="32" width="10" height="10" fill="#ffffff"/>
        <rect x="10" y="34" width="6" height="6" fill="#000000"/>

        <rect x="26" y="26" width="6" height="6" fill="#000000"/>
        <rect x="36" y="36" width="8" height="8" fill="#000000"/>

        <!-- Details Column -->
        <g transform="translate(65, 12)">
          <text x="0" y="0" font-family="monospace" font-size="9" fill="#94a3b8">DEPT: <tspan fill="#e2e8f0">AI &amp; BI LAB</tspan></text>
          <text x="0" y="14" font-family="monospace" font-size="9" fill="#94a3b8">ACCESS: <tspan fill="#10b981">LEVEL 5 [FULL]</tspan></text>
          <text x="0" y="28" font-family="monospace" font-size="9" fill="#94a3b8">LOC: <tspan fill="#e2e8f0">SURAT, GUJARAT</tspan></text>
        </g>
      </g>

      <!-- Bottom Barcode -->
      <g transform="translate(25, 310)">
        <rect x="0" y="0" width="200" height="25" fill="#ffffff" rx="2"/>
        <!-- Simulated Barcode Lines -->
        <path d="M 10 3 V 22 M 14 3 V 22 M 20 3 V 22 M 22 3 V 22 M 28 3 V 22 M 36 3 V 22 M 40 3 V 22 M 48 3 V 22 M 52 3 V 22 M 60 3 V 22 M 68 3 V 22 M 72 3 V 22 M 80 3 V 22 M 88 3 V 22 M 94 3 V 22 M 102 3 V 22 M 110 3 V 22 M 116 3 V 22 M 124 3 V 22 M 130 3 V 22 M 138 3 V 22 M 144 3 V 22 M 152 3 V 22 M 160 3 V 22 M 166 3 V 22 M 174 3 V 22 M 180 3 V 22 M 188 3 V 22" stroke="#000000" stroke-width="2"/>
        <text x="100" y="38" text-anchor="middle" class="badge-id">ID: INDO-ERA-2026-8893-AI</text>
      </g>
    </g>
  </g>
</svg>
