<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="auto">
  <defs>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="card-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyber-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
      <circle cx="25" cy="25" r="0.8" fill="#00f2fe" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse-node {
      0%, 100% { r: 3px; opacity: 0.4; }
      50% { r: 6px; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-10px); opacity: 0.9; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes wave-pulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50% { opacity: 0.8; transform: scaleY(1.15); }
    }
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 1.8px;
    }
    .sub-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-style: italic;
      font-size: 13.5px;
      fill: #38bdf8;
    }
    .badge-txt {
      font-family: 'Consolas', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 11px;
    }
    .node-1 { animation: pulse-node 3s infinite ease-in-out; }
    .node-2 { animation: pulse-node 4s infinite ease-in-out 1s; }
    .flow-line { stroke-dasharray: 6 4; animation: dash-flow 15s linear infinite; }
    .p-1 { animation: float-particle 5s infinite ease-in-out; }
    .p-2 { animation: float-particle 7s infinite ease-in-out 1.5s; }
  </style>

  <!-- Background -->
  <rect width="950" height="240" rx="14" fill="url(#dark-bg)"/>
  <rect width="950" height="240" rx="14" fill="url(#cyber-grid)"/>
  <rect width="948" height="238" x="1" y="1" rx="13" fill="none" stroke="url(#card-stroke)" stroke-width="1.5"/>

  <!-- Neural Mesh Connections (Background) -->
  <g opacity="0.3">
    <line x1="50" y1="40" x2="170" y2="90" stroke="#00f2fe" stroke-width="1" class="flow-line"/>
    <line x1="170" y1="90" x2="90" y2="180" stroke="#8b5cf6" stroke-width="1" class="flow-line"/>
    <line x1="90" y1="180" x2="220" y2="200" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="50" cy="40" r="4" fill="#00f2fe" class="node-1"/>
    <circle cx="170" cy="90" r="5" fill="#3b82f6" class="node-2"/>
    <circle cx="90" cy="180" r="4" fill="#8b5cf6" class="node-1"/>
  </g>

  <!-- Particles -->
  <circle cx="100" cy="30" r="2" fill="#00f2fe" class="p-1"/>
  <circle cx="250" cy="60" r="1.5" fill="#a855f7" class="p-2"/>
  <circle cx="880" cy="40" r="2" fill="#38bdf8" class="p-1"/>
  <circle cx="910" cy="190" r="1.5" fill="#00f2fe" class="p-2"/>

  <!-- Right Visual Graphics: AI Data Telemetry Screen -->
  <g transform="translate(710, 35)" opacity="0.9">
    <rect width="195" height="170" rx="10" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="195" height="24" rx="10" fill="#0f172a"/>
    <circle cx="15" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="27" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="39" cy="12" r="3.5" fill="#10b981"/>
    <text x="55" y="16" font-family="monospace" font-size="9.5" fill="#64748b">INDO_ERA_AI.LOG</text>

    <!-- Animated Data Bars -->
    <rect x="20" y="155" width="12" height="35" rx="2" fill="#00f2fe"/>
    <rect x="38" y="140" width="12" height="50" rx="2" fill="#3b82f6"/>
    <rect x="56" y="160" width="12" height="30" rx="2" fill="#8b5cf6"/>
    <rect x="74" y="130" width="12" height="60" rx="2" fill="#a855f7"/>
    <rect x="92" y="148" width="12" height="42" rx="2" fill="#00f2fe"/>
    <rect x="110" y="135" width="12" height="55" rx="2" fill="#38bdf8"/>
    <rect x="128" y="158" width="12" height="32" rx="2" fill="#8b5cf6"/>
    <rect x="146" y="142" width="12" height="48" rx="2" fill="#00f2fe"/>
    <rect x="164" y="150" width="12" height="40" rx="2" fill="#3b82f6"/>

    <path d="M 20 120 Q 50 85, 90 105 T 160 80 T 176 90" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#neon-glow)"/>
    <circle cx="176" cy="90" r="3" fill="#00f2fe" filter="url(#neon-glow)"/>

    <text x="16" y="48" font-family="monospace" font-size="9.5" fill="#10b981">● ROLE: DATA &amp; AI ENGINEER</text>
    <text x="16" y="63" font-family="monospace" font-size="9.5" fill="#38bdf8">● SYSTEM: INDO ERA BI</text>
    <text x="16" y="78" font-family="monospace" font-size="9.5" fill="#a855f7">● MODEL: ACTIVE</text>
  </g>

  <!-- Left Main Content -->
  <g transform="translate(45, 45)">
    <text x="0" y="32" fill="url(#text-glow)" class="title-text" filter="url(#neon-glow)">
      PATIL AVINASH CHANDRABHAN
    </text>

    <g transform="translate(0, 58)">
      <rect x="0" y="-18" width="415" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="1" class="sub-text">
        AI/ML Engineer &amp; Data Analyst <tspan fill="#38bdf8">@ Indo Era</tspan>
      </text>
    </g>

    <text x="0" y="100" class="tagline-text">
      ⚡ "Turning Enterprise Data into Business Intelligence &amp; AI Automation."
    </text>

    <!-- Skill Badges -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="68" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="34" y="16" text-anchor="middle" class="badge-txt" fill="#38bdf8">Python</text>

      <rect x="76" y="0" width="52" height="24" rx="12" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <text x="102" y="16" text-anchor="middle" class="badge-txt" fill="#00f2fe">SQL</text>

      <rect x="136" y="0" width="80" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="176" y="16" text-anchor="middle" class="badge-txt" fill="#f59e0b">Power BI</text>

      <rect x="224" y="0" width="58" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="253" y="16" text-anchor="middle" class="badge-txt" fill="#10b981">Excel</text>

      <rect x="290" y="0" width="138" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="359" y="16" text-anchor="middle" class="badge-txt" fill="#a855f7">Machine Learning</text>

      <rect x="436" y="0" width="42" height="24" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="457" y="16" text-anchor="middle" class="badge-txt" fill="#ec4899">AI</text>
    </g>
  </g>
</svg>
